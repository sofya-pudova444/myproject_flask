{% extends "base.html" %}

{% block title %}Каталог товаров{% endblock %}

{% block content %}
<div class="container">
    <div class="catalog">
        <!-- Карточка 1 -->
        <div class="card">
            <span class="badge badge-green">Акция</span>
            <img src="https://rus-buket.ru/files/icons/icon-5485.png" alt="Розы">
            <div class="title">"Счастливая пора"</div>
            <div class="price">4 720 ₽ <span>5 550 ₽</span></div>
            <button class="order-btn">🛒 Заказать</button>
        </div>

        <!-- Карточка 2 -->
        <div class="card">
            <img src="https://rus-buket.ru/files/icons/icon-8161.png" alt="Свежесть">
            <div class="title">Букет " из 11 гортензий"</div>
            <div class="price">2 600 ₽</div>
            <button class="order-btn">🛒 Заказать</button>
        </div>

        <!-- Карточка 3 -->
        <div class="card">
            <span class="badge badge-purple">Крупный бутон</span>
            <img src="https://rus-buket.ru/files/icons/icon-6250.png" alt="Весенний">
            <div class="title">Букет "из 51 разноцветной кенийской розы"</div>
            <div class="price">3 170 ₽ <span>4 230 ₽</span></div>
            <button class="order-btn">🛒 Заказать</button>
        </div>
    </div>
</div>
{% endblock %}
