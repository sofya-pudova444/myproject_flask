<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Цветочная симфония{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="header">
        <div class="container header__inner">
            <a href="{{ url_for('index') }}" class="logo">Цветочная симфония</a>

            <nav class="nav">
                <a href="{{ url_for('index') }}" class="nav__link">Главная</a>&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="{{ url_for('about') }}" class="nav__link">О нас</a>&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="{{ url_for('tovar') }}" class="nav__link">Товары</a>&nbsp;&nbsp;&nbsp;&nbsp;
                <a href="{{ url_for('contact') }}" class="nav__link">Контакты</a>
            </nav>

            <div class="header-spacer" style="width: 200px;"></div>
        </div>
    </header>

    <main class="main">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 МойСайт. Все права защищены.</p>
        </div>
    </footer>

</body>
</html>
